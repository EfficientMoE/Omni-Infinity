name: Bug Report
description: File an issue about a bug in Omni-Infinity.
title: "[BUG] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please provide as much detail as possible to help us address the issue efficiently.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      options:
        - label: I have reviewed the README and documentation.
          required: true
        - label: I have searched the [Issue Tracker](https://github.com/EfficientMoE/Omni-Infinity/issues) to ensure this hasn't been reported before.
          required: true

  - type: textarea
    id: system-info
    attributes:
      label: System Information
      description: OS, Python version, GPU (and VRAM), torch/diffusers versions, moe-store version, model-arch + optimizations.
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: Provide a clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      value: |
        Command / code:
        ```bash

        ```

        Steps:
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Logs, tracebacks, screenshots, or suggested fixes.
