[build-system]
requires = ["setuptools>=75.3.2", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-infinity"
description = "Memory-constrained single-server inference for dense omni-modal generative models (MiniMax-H3 class)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "torch>=2.0",
    "moe-store>=0.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-timeout",
    "ruff",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "av>=13,<19",
    "soundfile>=0.12,<1",
    "pillow>=10,<13",
]
serve = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "av>=13,<19",
    "soundfile>=0.12,<1",
    "pillow>=10,<13",
]

[project.urls]
Homepage = "https://github.com/EfficientMoE/Omni-Infinity"
RFC = "https://github.com/EfficientMoE/MoE-Infinity/issues/222"

[tool.setuptools.packages.find]
include = ["omni_infinity*"]

[tool.setuptools_scm]

[tool.ruff]
line-length = 80
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
