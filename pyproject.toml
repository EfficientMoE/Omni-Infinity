[build-system]
requires = ["setuptools>=75.3.2", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-infinity"
description = "Memory-constrained single-server inference for dense omni-modal generative models (MiniMax-H3 class)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "torch>=2.0",
    "moe-store>=0.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-timeout",
    "ruff",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "websockets>=12,<16",
    "httpx>=0.27,<1",
    "av>=13,<19",
    "soundfile>=0.12,<1",
    "pillow>=10,<13",
]
serve = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "websockets>=12,<16",
    "httpx>=0.27,<1",
    "av>=13,<19",
    "soundfile>=0.12,<1",
    "pillow>=10,<13",
]
bench = [
    "datasets>=2.19",
]

[project.urls]
Homepage = "https://github.com/EfficientMoE/Omni-Infinity"
RFC = "https://github.com/EfficientMoE/MoE-Infinity/issues/222"

[tool.setuptools.packages.find]
include = ["omni_infinity*"]

[tool.setuptools.package-data]
"omni_infinity.kernels._impls.cutlass_sm120" = ["*.cu", "*.cuh", "*.hpp"]

[tool.setuptools_scm]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs a CUDA device; GitHub-hosted CI excludes this mark",
    "weights: needs a local checkpoint or moe-store; GitHub-hosted CI excludes this mark",
]

[tool.coverage.run]
source = ["omni_infinity"]
omit = [
    "omni_infinity/kernels/_fused_fp8_gemm.py",
    "omni_infinity/kernels/_fused_mxfp4_gemm.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 80

[tool.ruff]
line-length = 80
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
